name: Feature request
description: Suggest something the program should be able to do
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do
      description: >-
        The research task behind the request, not only the feature. Knowing
        what you are computing often leads to a better answer than the one
        that was asked for, or to one that already exists.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What you would like
      description: How you imagine it working, from the outside.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: How you work around it now
      description: >-
        Another program, a script, a manual step. This says a lot about how
        much the feature is worth.
  - type: dropdown
    id: area
    attributes:
      label: Which part
      options:
        - The engine (the simulation itself)
        - The Studio (the desktop app)
        - Potential generation or conversion
        - Documentation and examples
        - Not sure
    validations:
      required: true
